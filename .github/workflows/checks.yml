name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Inspect the published commit, not GitHub's generated PR merge metadata.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - name: Check generated bundles match their sources
        run: git diff --exit-code -- web/react-ui.js web/manage-react.js web/frontend-LICENSES.txt web/react-ui.js.LEGAL.txt web/manage-react.js.LEGAL.txt
      - run: npx playwright install --with-deps chromium
      - name: React browser regressions
        env:
          SKYLIT_PREVIEW: http://127.0.0.1:8767
        run: |
          python3 scripts/preview.py > /tmp/skylit-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python3 - <<'PYTHON'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8767', timeout=1)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Synthetic preview did not start')
          PYTHON
          npm run test:react
          node scripts/check_dashboard_performance.cjs
          node scripts/check_library_performance.cjs
          node scripts/check_media_export.cjs
      - name: Website docs browser checks
        run: |
          python3 scripts/website.py serve > /tmp/skylit-site.log 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid"' EXIT
          node scripts/check_site_docs.cjs
      - run: python3 scripts/site_docs.py --check
      - run: node --test tests/*.test.cjs
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/check_public.py --history
